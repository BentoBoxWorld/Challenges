          <gray>切換玩家完成挑戰後，
          <gray>是否將此挑戰
          <gray>隱藏。
        enabled: <dark_green>已啟用
        disabled: <red>已停用
      team_challenge:
        name: <white><bold>團隊挑戰
        description: |-
          <gray>切換此挑戰是否為團隊挑戰。
          <gray>團隊挑戰需要有隊伍，
          <gray>並於整座島嶼共用完成狀態與冷卻時間。
        enabled: <dark_green>已啟用
        disabled: <red>已停用
      team_presence:
        name: <white><bold>團隊在線率
        description: |-
          <gray>完成此挑戰時，
          <gray>隊伍中必須在線的
          <gray>成員百分比。
          <gray>設為 0 可停用此限制。
        value: '<gray>目前：<yellow>[number]%'
