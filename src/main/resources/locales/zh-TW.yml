        name: <white><bold>團隊合併計算
        description: |-
          <gray>將所有在線成員的
          <gray>需求物品／統計資料合併計算
          <gray>（共同貢獻、共同努力）。
        enabled: <dark_green>已啟用
        disabled: <red>已停用
      per_member:
        name: <white><bold>每位成員皆需貢獻
