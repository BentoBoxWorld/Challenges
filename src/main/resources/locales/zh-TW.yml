meta:
  authors:
  - BONNe

challenges:
  materials:
    any: '任何'
    all_hanging_signs:
      name: 任何懸掛式告示牌
    all_signs:
      name: 任何告示牌
  
  commands:
    admin:
      main:
        parameters: ''
        description: 主要管理員指令。開啟介面。
      reload:
        description: 從資料庫重新載入挑戰資料。
        parameters: ''
      show:
        description: 在聊天室中顯示此世界的所有挑戰。
        parameters: ''
      complete:
        description: 為玩家完成一項挑戰。
        parameters: <player> <challenge_id>
      reset:
        description: 重設玩家的一項挑戰。若「challenge_id」設為「all」，則會重設所有挑戰。
        parameters: <player> <challenge_id>
      migrate:
        description: 將目前遊戲世界的挑戰資料遷移至 0.8.0 儲存格式。
        parameters: ''
    user:
      main:
        description: 開啟挑戰介面。
        parameters: ''
      complete:
        description: 完成一項挑戰。
        parameters: <challenge_id> [count]
  gui:
    titles:
      # The title for the Main GUI
      player-gui: <black><bold>挑戰選單
      # The title for the Main GUI
      gamemode-gui: <black><bold>選擇遊戲模式
      # The title for the Multiple Completion GUI
      multiple-gui: <black><bold>要完成幾次？
      # GUI titles below are visible just for Admins.
      admin-gui: <black><bold>挑戰管理選單
      edit-challenge: <black><bold>編輯 [challenge]
      edit-level: <black><bold>編輯 [level]
      settings: <black><bold>設定
      choose-challenge: <black><bold>選擇挑戰
      choose-level: <black><bold>選擇等級
      choose-player: <black><bold>選擇玩家
      library: <black><bold>圖書館
      manage-blocks: <black><bold>管理方塊
      manage-block-groups: <black><bold>管理方塊群組
      manage-entity-groups: <black><bold>管理實體群組
      manage-entities: <black><bold>管理實體
      manage-statistics: <black><bold>管理統計資料
      manage-advancements: <black><bold>管理進度
      advancement-selector: <black><bold>進度選擇器
      type-selector: <black><bold>挑戰類型選擇器
      item-selector: <black><bold>物品選擇器
      block-selector: <black><bold>方塊選擇器
      entity-selector: <black><bold>實體選擇器
      challenge-selector: <black><bold>挑戰選擇器
      statistic-selector: <black><bold>統計資料選擇器
      environment-selector: <black><bold>維度選擇器
      biome-selector: <black><bold>生態域選擇器
    buttons:
      # Button in the Challenges GUI that allows to select free challenges.
      free-challenges:
        name: <white><bold>自由挑戰
        description: |-
          <gray>顯示所有
          <gray>自由挑戰
# Button that is used to return to previous GUI or exit it completely.
      return:
        name: <white><bold>返回
        description: |-
          <gray>返回上一個選單
          <gray>或離開選單
# Button that is used in multi-page GUIs which allows to return to previous page.
      previous:
        name: <white><bold>上一頁
        description: <gray>切換至第 <yellow>[number] <gray>頁
# Button that is used in multi-page GUIs which allows to go to next page.
      next:
        name: <white><bold>下一頁
        description: <gray>切換至第 <yellow>[number] <gray>頁
# Button that allows to reduce number
      reduce:
        name: <white><bold>減少
        description: <gray>減少 <yellow>[number]
# Button that allows to increase number
      increase:
        name: <white><bold>增加
        description: <gray>增加 <yellow>[number]
# Button that displays and allows completing challenge
      accept:
        name: <white><bold>完成
        description: |-
          <gray>完成挑戰
          <yellow>[number] <gray>次
# Button that allows to quit the current gui.
      quit:
        name: <white><bold>離開
        description: <gray>離開選單。
# All following buttons are mainly for Admin GUI.
      complete_user_challenges:
        name: <white><bold>完成玩家挑戰
        description: |-
          <gray>選擇一位玩家，
          <gray>並替其完成挑戰。
      reset_user_challenges:
        name: <white><bold>重設玩家挑戰
        description: |-
          <gray>選擇一位玩家，
          <gray>並重設其挑戰。
      add_challenge:
        name: <white><bold>建立挑戰
        description: |-
          <gray>開始建立
          <gray>新的挑戰。
      add_level:
        name: <white><bold>建立等級
        description: |-
          <gray>開始建立
          <gray>新的等級。
      edit_challenge:
        name: <white><bold>編輯挑戰
        description: |-
          <gray>選擇並編輯
          <gray>一項挑戰。
      edit_level:
        name: <white><bold>編輯等級
        description: |-
          <gray>選擇並編輯
          <gray>一個等級。
      delete_challenge:
        name: <white><bold>刪除挑戰
        description: |-
          <gray>選擇並刪除
          <gray>一項挑戰。
      delete_level:
        name: <white><bold>刪除等級
        description: |-
          <gray>選擇並刪除
          <gray>一個等級。
      edit_settings:
        name: <white><bold>設定
        description: |-
          <gray>檢視並編輯
          <gray>附加元件設定。
      complete_wipe:
        name: <white><bold>完全清除
        description: |-
          <gray>完整清除挑戰
          <gray>附加元件資料庫，
          <gray>包含所有玩家資料。
      challenge_wipe:
        name: <white><bold>清除挑戰資料
        description: |-
          <gray>完整清除資料庫中的
          <gray>所有挑戰與等級。
      user_wipe:
        name: <white><bold>清除玩家資料
        description: |-
          <gray>完整清除資料庫中的
          <gray>所有玩家資料。
      library:
        name: <white><bold>圖書館
        description: |-
          <gray>開啟公開的
          <gray>挑戰圖書館。
        downloading: |-
          <gray>已提出下載
          <gray>圖書館請求……
      import_database:
        name: <white><bold>匯入資料庫
        description: |-
          <gray>匯入已匯出的
          <gray>挑戰資料庫。
      import_template:
        name: <white><bold>匯入範本
        description: |-
          <gray>匯入包含挑戰的
          <gray>範本檔案。
      export_challenges:
        name: <white><bold>匯出挑戰
        description: |-
          <gray>將資料庫匯出至
          <gray>本機檔案。
      properties:
        name: <white><bold>屬性
        description: <gray>檢視所有主要屬性。
      requirements:
        name: <white><bold>需求條件
        description: <gray>檢視需求條件屬性。
      rewards:
        name: <white><bold>獎勵
        description: <gray>檢視獎勵屬性。
      hide_reward_items:
        name: <white><bold>隱藏獎勵物品
        description: |-
          <gray>切換是否在選單中
          <gray>顯示獎勵物品。
        hide: <dark_green>隱藏
        show: <red>顯示
      deployed:
        name: <white><bold>部署
        description: |-
          <gray>切換此挑戰是否已部署，
          <gray>並允許玩家
          <gray>完成。
        enabled: <dark_green>已啟用
        disabled: <red>已停用
      name:
        name: <white><bold>名稱
        description: |-
          <gray>允許你變更
          <gray>顯示名稱。
        value: '<gray>目前：<reset>[name]'
      remove_on_complete:
        name: <white><bold>完成後隱藏
