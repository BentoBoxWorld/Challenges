        description: |-
          <gray>設定此挑戰的描述。
          <gray>需自行加入色彩代碼。
        value: '<gray>目前描述：'
      environment:
        name: <white><bold>維度
        description: |-
          <gray>允許你將此挑戰
          <gray>限制於指定維度。
        enabled: <dark_green>
        disabled: <red>
      order:
        name: <white><bold>排序
        description: |-
          <gray>允許你調整
          <gray>物件的排序順序。
          <gray>若排序值相同，
